<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下一班車 Next Departure</title>
  <style>
    :root {
      --orange: #f36c21;
      --blue: #0b3c75;
      --white: #ffffff;
      --black: #000000;
      --border-gray: #c5d3df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; user-select: none; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: var(--white); }

    .display-screen { width: 100vw; height: 100vh; background-color: var(--white); display: flex; flex-direction: column; }

    .clock-bar {
      background-color: var(--white);
      color: var(--orange); 
      padding: 1vh 2vw;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: clamp(14px, 1.8vh, 22px);
      font-weight: 800;
      height: 7vh;
      border-bottom: 1px solid var(--border-gray);
    }
    .clock-bar span { margin-left: 10px; font-size: clamp(24px, 4vh, 50px); font-weight: 900; color: var(--orange); }

    .grid-wrapper { flex: 1; display: flex; flex-direction: column; background-color: var(--border-gray); }

    .eta-header-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; background-color: var(--border-gray); }
    .eta-header-bar div { background-color: var(--orange); color: var(--white); font-weight: bold; font-size: clamp(12px, 1.6vh, 20px); height: 3.5vh; display: flex; align-items: center; justify-content: flex-end; padding-right: 1.5vw; }

    .grid-container { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 1.5px; background-color: var(--border-gray); }
    .cell { background-color: var(--white); display: flex; justify-content: space-between; align-items: flex-start; padding: 1.5vh 1.5vw; }

    .left-col { display: flex; flex-direction: column; justify-content: flex-start; gap: 0.5vh; }
    .route-num { font-size: clamp(38px, 6vh, 80px); font-weight: 900; color: var(--black); line-height: 0.85; letter-spacing: -1px; }
    .route-dest { display: flex; flex-direction: column; }
    .dest-zh { font-size: clamp(13px, 1.8vh, 24px); font-weight: 800; color: var(--black); line-height: 1.2; }
    .dest-en { font-size: clamp(8px, 1.1vh, 14px); font-weight: 700; color: #555; text-transform: uppercase; line-height: 1.1; }
    .route-eta { font-size: clamp(38px, 6vh, 80px); font-weight: 900; color: var(--blue); text-align: right; line-height: 0.85; letter-spacing: 0.5px; align-self: flex-start; }
  </style>
</head>
<body>

  <div class="display-screen">
    <div class="clock-bar">
      現在時間 Current Time : <span id="currentTime">--:--</span>
    </div>

    <div class="grid-wrapper">
      <div class="eta-header-bar">
        <div>預計時間 ETA</div><div>預計時間 ETA</div><div>預計時間 ETA</div>
      </div>
      <div class="grid-container" id="routeGrid"></div>
    </div>
  </div>

  <script>
    const STOP_ID = "001552";
    const ITEMS_PER_PAGE = 12;
    let routesData = [];
    let currentPage = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    async function fetchData() {
      // 使用 AllOrigins 代理以繞過 CORS 封鎖
      const proxyUrl = 'https://api.allorigins.win/get?url=';
      const targetUrl = encodeURIComponent(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}`);
      
      try {
        const res = await fetch(proxyUrl + targetUrl);
        const json = await res.json();
        const data = JSON.parse(json.contents); // 解析代理回傳的內容

        if (data?.data) {
          const nowMs = Date.now() - 60000;
          const map = new Map();
          data.data.forEach(item => {
            if (item.eta) {
              const etaMs = new Date(item.eta).getTime();
              if (etaMs >= nowMs && (!map.has(item.route) || etaMs < map.get(item.route).rawTime)) {
                map.set(item.route, {
                  route: item.route,
                  destZh: `往 ${item.dest_tc || ''}`,
                  destEn: `TO ${item.dest_en ? item.dest_en.toUpperCase() : ''}`,
                  eta: `${String(new Date(item.eta).getHours()).padStart(2, '0')}:${String(new Date(item.eta).getMinutes()).padStart(2, '0')}`,
                  rawTime: etaMs
                });
              }
            }
          });
          routesData = Array.from(map.values()).sort((a, b) => a.route.localeCompare(b.route, 'en', { numeric: true }));
          renderPage(currentPage);
        }
      } catch (err) { console.warn("Proxy Fetch Error", err); }
    }

    function renderPage(pageIndex) {
      const grid = document.getElementById('grid'); // 修正 ID 對應
      const gridContainer = document.getElementById('routeGrid');
      gridContainer.innerHTML = '';
      const pageItems = routesData.slice(pageIndex * ITEMS_PER_PAGE, (pageIndex + 1) * ITEMS_PER_PAGE);
      for (let i = 0; i < ITEMS_PER_PAGE; i++) {
        const item = pageItems[i];
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (item) {
          cell.innerHTML = `
            <div class="left-col">
              <div class="route-num">${item.route}</div>
              <div class="route-dest"><div class="dest-zh">${item.destZh}</div><div class="dest-en">${item.destEn}</div></div>
            </div>
            <div class="route-eta">${item.eta}</div>
          `;
        }
        gridContainer.appendChild(cell);
      }
    }

    document.addEventListener('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });
    setInterval(updateClock, 1000);
    setInterval(fetchData, 30000);
    setInterval(() => { currentPage = (currentPage + 1) % Math.ceil((routesData.length || 1) / ITEMS_PER_PAGE); renderPage(currentPage); }, 10000);
    updateClock();
    fetchData();
  </script>
</body>
</html>
