<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍運巴士機場地面運輸中心顯示屏模擬器 LWB GTC PIDS Simulator</title>
  <style>
    :root {
      --orange: #f36c21;
      --blue: #0b3c75;
      --white: #ffffff;
      --black: #000000;
      --border-gray: #c5d3df;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; 
      user-select: none;
    }

    html, body { 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--white);
    }

    .display-screen {
      width: 100vw;
      height: 100vh;
      background-color: var(--white);
      display: flex;
      flex-direction: column;
    }

    .clock-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px; 
      background-color: var(--white); 
      min-height: 14vh; 
    }

    .clock-empty { background-color: var(--white); }

    /* 更新：時鐘容器移至第三欄左側，內部文字互相比例置中 */
    .clock-wrapper {
      grid-column: 3;
      background-color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; /* 讓時間 XX:XX 於標題下方置中 */
      justify-self: flex-start; /* 將整個區塊對齊到第三欄的最左邊 */
      padding-left: 1.5vw; /* 稍微留點空間，不讓文字死貼框線 */
    }

    .clock-title {
      font-size: clamp(16px, 2.2vh, 26px);
      font-weight: 700;
      color: var(--orange);
      line-height: 1.2;
      margin-bottom: 0.5vh; 
      text-align: center;
    }

    .clock-time {
      font-size: clamp(45px, 7vh, 85px); 
      font-weight: 900;
      color: var(--orange);
      line-height: 1;
      text-align: center;
    }

    .grid-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--border-gray);
    }

    .eta-header-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px; 
      background-color: var(--border-gray);
    }

    .eta-header-bar div {
      background-color: var(--orange);
      color: var(--white);
      font-weight: bold;
      font-size: clamp(12px, 1.8vh, 22px);
      height: 4vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 1.5vw;
    }

    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr); 
      background-color: var(--border-gray);
      gap: 1.5px;
    }

    .cell {
      background-color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.5vh 0.8vw; 
    }

    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0vh;
    }

    .route-num { 
      font-size: clamp(45px, 7.2vh, 95px); 
      font-weight: 900; 
      color: var(--black); 
      line-height: 0.85;
      letter-spacing: -1px;
    }

    .route-dest { 
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 0.5vh;
    }

    .dest-zh {
      font-size: clamp(16px, 2.4vh, 32px);
      font-weight: 800;
      color: var(--black);
      line-height: 1.1;
    }

    .dest-en {
      font-size: clamp(11px, 1.4vh, 18px);
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      line-height: 1;
    }

    .route-eta { 
      font-size: clamp(45px, 7.2vh, 95px); 
      font-weight: 900; 
      color: var(--blue); 
      text-align: right; 
      line-height: 0.85;
      letter-spacing: 0.5px;
      align-self: flex-start; 
    }

    .loading-msg {
      grid-column: 1/4; 
      text-align: center; 
      font-size: clamp(24px, 4vh, 40px); 
      padding-top: 5vh; 
      font-weight: bold; 
      color: var(--blue);
    }
  </style>
</head>
<body>

  <div class="display-screen" id="screen">
    <div class="clock-bar">
      <div class="clock-empty"></div>
      <div class="clock-empty"></div>
      <!-- 時鐘區塊 -->
      <div class="clock-wrapper">
        <div class="clock-title">現在時間 Current Time :</div>
        <div class="clock-time" id="currentTime">--:--</div>
      </div>
    </div>

    <div class="grid-wrapper">
      <div class="eta-header-bar">
        <div>預計時間 ETA</div>
        <div>預計時間 ETA</div>
        <div>預計時間 ETA</div>
      </div>
      <div class="grid-container" id="routeGrid">
        <div class="loading-msg">🔄 正在連線至九巴系統載入即時班次...</div>
      </div>
    </div>
  </div>

  <script>
    const ITEMS_PER_PAGE = 15; 

    const fallbackList = [
      { route: "A30", destZh: "往 梨木樹", destEn: "TO LEI MUK SHUE" },
      { route: "A31", destZh: "往 荃灣(如心廣場)", destEn: "TO TSUEN WAN (NINA TOWER)" },
      { route: "A32", destZh: "往 葵涌邨", destEn: "TO KWAI CHUNG ESTATE" },
      { route: "A33", destZh: "往 屯門公路轉車站", destEn: "TO TUEN MUN ROAD BBI" },
      { route: "A33X", destZh: "往 屯門(富泰邨)", destEn: "TO TUEN MUN (FU TAI ESTATE)" },
      { route: "A34", destZh: "往 洪水橋(洪元路)", destEn: "TO HUNG SHUI KIU (HUNG YUEN ROAD)" },
      { route: "A36", destZh: "往 錦上路站", destEn: "TO KAM SHEUNG ROAD STATION" },
      { route: "A38", destZh: "往 荃灣(荃威花園)", destEn: "TO TSUEN WAN (ALLWAY GARDENS)" },
      { route: "A41", destZh: "往 碩門邨", destEn: "TO SHEK MUN ESTATE" },
      { route: "A41P", destZh: "往 烏溪沙站", destEn: "TO WU KAI SHA STATION" },
      { route: "A42", destZh: "往 黃泥頭", destEn: "TO WONG NAI TAU" },
      { route: "A43", destZh: "往 粉嶺(聯和墟)", destEn: "TO FANLING (LUEN WO HUI)" },
      { route: "A43P", destZh: "往 粉嶺(聯和墟)", destEn: "TO FANLING (LUEN WO HUI)" },
      { route: "A46", destZh: "往 火炭(駿景園)", destEn: "TO FO TAN (ROYAL ASCOT)" },
      { route: "A47X", destZh: "往 大埔(太和)", destEn: "TO TAI PO (TAI WO)" },
      { route: "E32", destZh: "往 葵芳(南)", destEn: "TO KWAI FONG (SOUTH)" },
      { route: "E33", destZh: "往 屯門市中心", destEn: "TO TUEN MUN CENTRAL" },
      { route: "E36", destZh: "往 元朗(八鄉路)", destEn: "TO YUEN LONG (PAT HEUNG ROAD)" },
      { route: "E37", destZh: "往 天水圍市中心", destEn: "TO TIN SHUI WAI TOWN CENTRE" },
      { route: "E41", destZh: "往 大埔頭", destEn: "TO TAI PO TAU" },
      { route: "E42", destZh: "往 沙田(博康)", destEn: "TO SHA TIN (POK HONG)" }
    ];

    let routesData = [];
    let currentPage = 0;
    let gtcStopIds = []; 

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function formatTime(etaStr) {
      if (!etaStr) return "-";
      const d = new Date(etaStr);
      if (isNaN(d.getTime())) return "-";
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function initGtcStopIds() {
      const cachedIds = localStorage.getItem('gtc_stop_ids_v1');
      if (cachedIds) {
        gtcStopIds = JSON.parse(cachedIds);
        return; 
      }

      try {
        document.getElementById('routeGrid').innerHTML = `<div class="loading-msg">🔄 系統首次初始化 (尋找機場站點中)，請稍候幾秒鐘...</div>`;
        const res = await fetch("https://data.etabus.gov.hk/v1/transport/kmb/stop");
        const json = await res.json();
        if (json && Array.isArray(json.data)) {
          const stops = json.data.filter(s => s.name_tc && s.name_tc.includes("地面運輸中心"));
          gtcStopIds = [...new Set(stops.map(s => s.stop))];
          localStorage.setItem('gtc_stop_ids_v1', JSON.stringify(gtcStopIds)); 
        }
      } catch (err) {
        console.error("無法取得站點清單", err);
      }
    }

    async function fetchData() {
      try {
        if (gtcStopIds.length === 0) {
          await initGtcStopIds();
        }

        if (gtcStopIds.length === 0) return;

        const nowMs = Date.now() - 60000; 
        const map = new Map();
        const allowedRoutes = new Set(fallbackList.map(r => r.route));
        
        let allData = [];
        let hasSuccess = false;

        const promises = gtcStopIds.map(id => 
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${id}?_t=${Date.now()}`)
          .then(r => r.json())
          .catch(() => null)
        );
        const results = await Promise.all(promises);
        
        results.forEach(res => {
          if (res && Array.isArray(res.data)) {
            allData.push(...res.data);
            hasSuccess = true;
          }
        });

        if (hasSuccess) {
          allData.forEach(item => {
            if (allowedRoutes.has(item.route) && item.eta && !item.dest_tc.includes("機場")) {
              const etaMs = new Date(item.eta).getTime();
              if (!isNaN(etaMs) && etaMs >= nowMs) {
                if (!map.has(item.route) || etaMs < map.get(item.route).rawTime) {
                  map.set(item.route, {
                    route: item.route,
                    destZh: `往 ${item.dest_tc || ''}`,
                    destEn: `TO ${item.dest_en ? item.dest_en.toUpperCase() : ''}`,
                    eta: formatTime(item.eta),
                    rawTime: etaMs
                  });
                }
              }
            }
          });

          if (map.size > 0) {
            routesData = Array.from(map.values()).sort((a, b) =>
              a.route.localeCompare(b.route, 'en', { numeric: true, sensitivity: 'base' })
            );
          } else {
            routesData = [];
          }
          
          renderPage(currentPage);
        }
      } catch (err) {
        console.error("API 處理異常:", err);
      }
    }

    function renderPage(pageIndex) {
      const grid = document.getElementById('routeGrid');
      
      if (routesData.length === 0) {
        grid.innerHTML = `<div class="loading-msg" style="color: #666;">目前時段暫無班次資料</div>`;
        return;
      }

      const totalPages = Math.ceil(routesData.length / ITEMS_PER_PAGE) || 1;
      currentPage = pageIndex % totalPages;
      if (currentPage < 0) currentPage = totalPages - 1;

      grid.innerHTML = '';
      const startIndex = currentPage * ITEMS_PER_PAGE;
      const pageItems = routesData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      for (let i = 0; i < ITEMS_PER_PAGE; i++) {
        const item = pageItems[i];
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (item) {
          cell.innerHTML = `
            <div class="left-col">
              <div class="route-num">${item.route}</div>
              <div class="route-dest">
                <div class="dest-zh">${item.destZh}</div>
                <div class="dest-en">${item.destEn}</div>
              </div>
            </div>
            <div class="route-eta">${item.eta}</div>
          `;
        }
        grid.appendChild(cell);
      }
    }

    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    });

    updateClock();
    setInterval(updateClock, 1000);

    fetchData(); 
    setInterval(fetchData, 15000); 
    setInterval(() => {
      if (routesData.length > 0) renderPage(currentPage + 1);
    }, 10000); 
  </script>
</body>
</html>
