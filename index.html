<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍運巴士 Next Departure 資訊屏模擬</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Arial", "PingFang HK", "Microsoft JhengHei", sans-serif;
      user-select: none;
    }

    body {
      background-color: #0b1d3a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #000;
    }

    /* 模擬電視螢幕外框 */
    .screen-container {
      width: 1000px;
      height: 600px;
      background-color: #cce4f7;
      border: 6px solid #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 頂部時鐘與標題列 */
    .header {
      background-color: #d8ecfa;
      height: 48px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 24px;
      border-bottom: 2px solid #8cbcdb;
    }

    .time-box {
      text-align: right;
      font-weight: bold;
    }

    .time-label {
      font-size: 11px;
      color: #333;
      margin-bottom: 2px;
    }

    .current-time {
      font-size: 24px;
      color: #102a5c;
      letter-spacing: 1px;
    }

    /* 3 欄式路線網格 */
    .route-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      flex: 1;
      background-color: #8cbcdb;
      gap: 1.5px;
      border: 1.5px solid #8cbcdb;
    }

    /* 單個路線卡片 */
    .route-card {
      background-color: #eaf3fa;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background-color: #b51c1c;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      text-align: right;
      padding: 2px 10px;
      height: 18px;
      line-height: 14px;
    }

    .card-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4px 10px;
      background-color: #d4e8f7;
    }

    .route-num {
      font-size: 38px;
      font-weight: 900;
      color: #0b457e;
      width: 95px;
      letter-spacing: -1px;
    }

    .dest-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.15;
      padding-left: 2px;
    }

    .dest-zh {
      font-size: 13px;
      font-weight: bold;
      color: #111;
    }

    .dest-en {
      font-size: 9.5px;
      color: #444;
      font-weight: 600;
      text-transform: uppercase;
    }

    .eta-box {
      font-size: 30px;
      font-weight: 800;
      color: #0b457e;
      text-align: right;
      min-width: 90px;
      letter-spacing: 0.5px;
    }

    /* 底部控制欄與頁碼 */
    .footer {
      background-color: #1a335a;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px;
      font-size: 13px;
    }

    .nav-btn {
      background: #2a5288;
      border: 1px solid #5583be;
      color: #fff;
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }

    .nav-btn:hover {
      background: #3b6ea8;
    }
  </style>
</head>
<body>

  <div class="screen-container">
    <!-- 頂部即時時間 -->
    <div class="header">
      <div class="time-box">
        <div class="time-label">現在時間 Current Time :</div>
        <div class="current-time" id="currentTime">--:--:--</div>
      </div>
    </div>

    <!-- 路線資料網格 (動態渲染) -->
    <div class="route-grid" id="routeGrid"></div>

    <!-- 底部控制與頁碼 -->
    <div class="footer">
      <button class="nav-btn" onclick="prevPage()">◀ 上一頁</button>
      <span id="pageIndicator">載入中...</span>
      <button class="nav-btn" onclick="nextPage()">下一頁 ▶</button>
    </div>
  </div>

  <script>
    // 設定要監聽的站點 ID (預設為 機場地面運輸中心 001552)
    const STOP_ID = "001552";
    const ITEMS_PER_PAGE = 12;

    let routesData = [];
    let currentPage = 0;
    let autoPageTimer = null;

    // 更新頂部實時時鐘
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
    }

    // 格式化 API 回傳的時間為 HH:MM
    function formatETA(etaTimeString) {
      if (!etaTimeString) return "-";
      const etaDate = new Date(etaTimeString);
      if (isNaN(etaDate.getTime())) return "-";
      
      const h = String(etaDate.getHours()).padStart(2, '0');
      const m = String(etaDate.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    // 從政府開放資料 API 獲取即時 ETA
    async function fetchETADefault() {
      try {
        const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}`);
        const result = await response.json();

        if (!result.data || !Array.isArray(result.data)) return;

        // 整理資料：每條路線只取最近的一班車
        const map = new Map();
        result.data.forEach(item => {
          if (!map.has(item.route) && item.eta) {
            map.set(item.route, {
              route: item.route,
              destZh: `往 ${item.dest_tc}`,
              destEn: `TO ${item.dest_en.toUpperCase()}`,
              eta: formatETA(item.eta),
              rawEta: item.eta
            });
          }
        });

        // 依路線名稱自然排序
        routesData = Array.from(map.values()).sort((a, b) => 
          a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' })
        );

        // 重新渲染當前頁面
        renderPage(currentPage);
      } catch (error) {
        console.error("無法取得即時巴士資料：", error);
        document.getElementById('pageIndicator').textContent = "API 連線失敗或站點無資料";
      }
    }

    // 渲染指定頁面
    function renderPage(pageIndex) {
      const totalPages = Math.ceil(routesData.length / ITEMS_PER_PAGE) || 1;
      currentPage = pageIndex % totalPages;
      if (currentPage < 0) currentPage = totalPages - 1;

      const grid = document.getElementById('routeGrid');
      grid.innerHTML = '';

      const startIndex = currentPage * ITEMS_PER_PAGE;
      const pageItems = routesData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      for (let i = 0; i < ITEMS_PER_PAGE; i++) {
        const item = pageItems[i];
        const card = document.createElement('div');
        card.className = 'route-card';

        if (item) {
          card.innerHTML = `
            <div class="card-header">預計時間 ETA</div>
            <div class="card-body">
              <div class="route-num">${item.route}</div>
              <div class="dest-info">
                <div class="dest-zh">${item.destZh}</div>
                <div class="dest-en">${item.destEn}</div>
              </div>
              <div class="eta-box">${item.eta}</div>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="card-header" style="visibility:hidden;">-</div>
            <div class="card-body" style="visibility:hidden;"></div>
          `;
        }
        grid.appendChild(card);
      }

      document.getElementById('pageIndicator').textContent = 
        `第 ${currentPage + 1} 頁 / 共 ${totalPages} 頁 (每 10 秒自動翻頁)`;
    }

    function nextPage() {
      renderPage(currentPage + 1);
      resetAutoPlay();
    }

    function prevPage() {
      renderPage(currentPage - 1);
      resetAutoPlay();
    }

    function resetAutoPlay() {
      clearInterval(autoPageTimer);
      autoPageTimer = setInterval(() => {
        renderPage(currentPage + 1);
      }, 10000); // 10 秒切換下一頁
    }

    // 初始化執行
    setInterval(updateClock, 1000);
    updateClock();

    // 初次載入資料並設定每 30 秒向 API 刷新一次最新時間
    fetchETADefault();
    setInterval(fetchETADefault, 30000);

    resetAutoPlay();
  </script>
</body>
</html>
