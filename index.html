<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下一班車 Next Departure (純 API 測試版)</title>
  <style>
    :root {
      --orange: #f36c21;
      --blue: #0b3c75;
      --white: #ffffff;
      --black: #000000;
      --border-gray: #c5d3df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; user-select: none; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: var(--white); }

    .display-screen { width: 100vw; height: 100vh; background-color: var(--white); display: flex; flex-direction: column; }

    .clock-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; background-color: var(--white); min-height: 14vh; }
    .clock-empty { background-color: var(--white); }
    .clock-wrapper { grid-column: 3; background-color: var(--white); display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding-right: 1.5vw; }
    .clock-title { font-size: clamp(16px, 2.2vh, 26px); font-weight: 700; color: var(--orange); line-height: 1.2; margin-bottom: 0.5vh; }
    .clock-time { font-size: clamp(45px, 7vh, 85px); font-weight: 900; color: var(--orange); line-height: 1; }

    .grid-wrapper { flex: 1; display: flex; flex-direction: column; background-color: var(--border-gray); }
    .eta-header-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; background-color: var(--border-gray); }
    .eta-header-bar div { background-color: var(--orange); color: var(--white); font-weight: bold; font-size: clamp(12px, 1.8vh, 22px); height: 4vh; display: flex; align-items: center; justify-content: flex-end; padding-right: 1.5vw; }

    .grid-container { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(5, 1fr); background-color: var(--border-gray); gap: 1.5px; }
    .cell { background-color: var(--white); display: flex; justify-content: space-between; align-items: flex-start; padding: 0.5vh 0.8vw; }

    .left-col { display: flex; flex-direction: column; justify-content: flex-start; gap: 0vh; }
    .route-num { font-size: clamp(45px, 7.2vh, 95px); font-weight: 900; color: var(--black); line-height: 0.85; letter-spacing: -1px; }
    .route-dest { display: flex; flex-direction: column; justify-content: center; margin-top: 0.5vh; }
    .dest-zh { font-size: clamp(16px, 2.4vh, 32px); font-weight: 800; color: var(--black); line-height: 1.1; }
    .dest-en { font-size: clamp(11px, 1.4vh, 18px); font-weight: 700; color: #555; text-transform: uppercase; line-height: 1; }
    
    .route-eta { font-size: clamp(45px, 7.2vh, 95px); font-weight: 900; color: var(--blue); text-align: right; line-height: 0.85; letter-spacing: 0.5px; align-self: flex-start; }
  </style>
</head>
<body>

  <div class="display-screen" id="screen">
    <div class="clock-bar">
      <div class="clock-empty"></div>
      <div class="clock-empty"></div>
      <div class="clock-wrapper">
        <div class="clock-title">現在時間 Current Time :</div>
        <div class="clock-time" id="currentTime">--:--</div>
      </div>
    </div>

    <div class="grid-wrapper">
      <div class="eta-header-bar">
        <div>預計時間 ETA</div>
        <div>預計時間 ETA</div>
        <div>預計時間 ETA</div>
      </div>
      <div class="grid-container" id="routeGrid"></div>
    </div>
  </div>

  <script>
    const STOP_ID = "001552"; // GTC 機場地面運輸中心
    const ITEMS_PER_PAGE = 15; 

    let routesData = []; // 完全清空假資料，只依賴真實 API
    let currentPage = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function formatTime(etaStr) {
      if (!etaStr) return "-";
      const d = new Date(etaStr);
      if (isNaN(d.getTime())) return "-";
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function fetchData() {
      try {
        // 直接向九巴 API 請求 (加上 _t 防止快取)
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}?_t=${Date.now()}`);
        
        if (!res.ok) {
            throw new Error(`伺服器回應錯誤: ${res.status}`);
        }

        const json = await res.json();

        if (json && Array.isArray(json.data)) {
          const nowMs = Date.now() - 60000; 
          const map = new Map();

          json.data.forEach(item => {
            if (item.eta) {
              const etaMs = new Date(item.eta).getTime();
              if (!isNaN(etaMs) && etaMs >= nowMs) {
                if (!map.has(item.route) || etaMs < map.get(item.route).rawTime) {
                  map.set(item.route, {
                    route: item.route,
                    destZh: `往 ${item.dest_tc || ''}`,
                    destEn: `TO ${item.dest_en ? item.dest_en.toUpperCase() : ''}`,
                    eta: formatTime(item.eta),
                    rawTime: etaMs
                  });
                }
              }
            }
          });

          routesData = Array.from(map.values()).sort((a, b) =>
            a.route.localeCompare(b.route, 'en', { numeric: true, sensitivity: 'base' })
          );
        } else {
            routesData = []; // 如果 API 正常但沒巴士，清空畫面
        }
      } catch (err) {
        // 【診斷訊息】如果網路連線失敗或被阻擋，會直接印在畫面上
        console.error("API 連線失敗：", err);
        routesData = [{
            route: "ERROR",
            destZh: "API 連線失敗",
            destEn: "CHECK BROWSER CONSOLE",
            eta: "---"
        }];
      }
      
      renderPage(currentPage);
    }

    function renderPage(pageIndex) {
      const totalPages = Math.ceil(routesData.length / ITEMS_PER_PAGE) || 1;
      currentPage = pageIndex % totalPages;
      if (currentPage < 0) currentPage = totalPages - 1;

      const grid = document.getElementById('routeGrid');
      grid.innerHTML = '';

      const startIndex = currentPage * ITEMS_PER_PAGE;
      const pageItems = routesData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      // 如果完全沒有資料
      if (routesData.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/4; text-align: center; font-size: 30px; padding-top: 50px; font-weight: bold; color: #555;">目前時段暫無班次資料</div>`;
        return;
      }

      for (let i = 0; i < ITEMS_PER_PAGE; i++) {
        const item = pageItems[i];
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (item) {
          cell.innerHTML = `
            <div class="left-col">
              <div class="route-num">${item.route}</div>
              <div class="route-dest">
                <div class="dest-zh">${item.destZh}</div>
                <div class="dest-en">${item.destEn}</div>
              </div>
            </div>
            <div class="route-eta">${item.eta}</div>
          `;
        }
        grid.appendChild(cell);
      }
    }

    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    });

    updateClock();
    setInterval(updateClock, 1000);

    renderPage(0);
    fetchData(); // 初次抓取
    setInterval(fetchData, 15000); // 15秒更新一次
    setInterval(() => renderPage(currentPage + 1), 10000); // 10秒翻頁
  </script>
</body>
</html>
