<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下一班車 Next Departure</title>
  <style>
    :root {
      --orange: #f36c21;
      --blue: #0b3c75;
      --white: #ffffff;
      --black: #000000;
      --border-gray: #c5d3df;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; 
      user-select: none;
    }

    html, body { 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--white);
    }

    .display-screen {
      width: 100vw;
      height: 100vh;
      background-color: var(--white);
      display: flex;
      flex-direction: column;
    }

    /* 頂部時鐘區域：改為 3 欄網格以對齊下方的第三欄 */
    .clock-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px; /* 與下方表格保持相同的間距基準 */
      background-color: var(--white); /* 讓間距隱形 */
      min-height: 14vh; 
    }

    .clock-empty {
      background-color: var(--white);
    }

    /* 時鐘容器：放在第 3 欄，並靠左對齊 */
    .clock-wrapper {
      grid-column: 3;
      background-color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start; /* 靠左對齊 */
      padding: 0 0.8vw; /* 與下方路線表格的 padding 保持一致，實現完美對齊 */
    }

    .clock-title {
      font-size: clamp(16px, 2.2vh, 26px);
      font-weight: 700;
      color: var(--orange);
      line-height: 1.2;
      margin-bottom: 1.8vh; /* 產生空行效果 */
    }

    .clock-time {
      font-size: clamp(45px, 7vh, 85px); 
      font-weight: 900;
      color: var(--orange);
      line-height: 1;
    }

    /* 確保分隔線貫穿：用 wrapper 包住標題與表格 */
    .grid-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--border-gray);
    }

    /* 橙底白字標題列 */
    .eta-header-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px; 
      background-color: var(--border-gray);
    }

    .eta-header-bar div {
      background-color: var(--orange);
      color: var(--white);
      font-weight: bold;
      font-size: clamp(12px, 1.8vh, 22px);
      height: 4vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 1.5vw;
    }

    /* 路線網格：5 行 */
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr); 
      background-color: var(--border-gray);
      gap: 1.5px;
    }

    /* 貼住框線：大幅縮減 padding */
    .cell {
      background-color: var(--white);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.5vh 0.8vw; 
    }

    /* 左側區塊：路線編號與目的地 */
    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0vh;
    }

    /* 路線編號：按比例加大 */
    .route-num { 
      font-size: clamp(45px, 7.2vh, 95px); 
      font-weight: 900; 
      color: var(--black); 
      line-height: 0.85;
      letter-spacing: -1px;
    }

    /* 目的地：按比例加大 */
    .route-dest { 
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: 0.5vh;
    }

    .dest-zh {
      font-size: clamp(16px, 2.4vh, 32px);
      font-weight: 800;
      color: var(--black);
      line-height: 1.1;
    }

    .dest-en {
      font-size: clamp(11px, 1.4vh, 18px);
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      line-height: 1;
    }

    /* 藍色時間：按比例加大並置頂 */
    .route-eta { 
      font-size: clamp(45px, 7.2vh, 95px); 
      font-weight: 900; 
      color: var(--blue); 
      text-align: right; 
      line-height: 0.85;
      letter-spacing: 0.5px;
      align-self: flex-start; 
    }
  </style>
</head>
<body>

  <div class="display-screen" id="screen">
    <!-- 頂部時鐘區域 -->
    <div class="clock-bar">
      <div class="clock-empty"></div>
      <div class="clock-empty"></div>
      <div class="clock-wrapper">
        <div class="clock-title">現在時間 Current Time :</div>
        <div class="clock-time" id="currentTime">--:--</div>
      </div>
    </div>

    <!-- 標題與表格被 wrapper 包住以顯示連貫直線 -->
    <div class="grid-wrapper">
      <div class="eta-header-bar">
        <div>預計時間 ETA</div>
        <div>預計時間 ETA</div>
        <div>預計時間 ETA</div>
      </div>
      <div class="grid-container" id="routeGrid"></div>
    </div>
  </div>

<script>
    const STOP_ID = "001552"; // GTC 機場地面運輸中心
    const ITEMS_PER_PAGE = 15; // 3欄 x 5行

    let routesData = [];
    let currentPage = 0;

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function formatTime(etaStr) {
      if (!etaStr) return "-";
      const d = new Date(etaStr);
      if (isNaN(d.getTime())) return "-";
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function fetchData() {
      try {
        // 加入時間戳記 _t 確保每次都是最新的實時資料，避開瀏覽器/ISP 快取
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}?_t=${Date.now()}`);
        const json = await res.json();

        if (json && Array.isArray(json.data)) {
          const nowMs = Date.now() - 60000; 
          const map = new Map();

          json.data.forEach(item => {
            if (item.eta) {
              const etaMs = new Date(item.eta).getTime();
              // 過濾掉已過期的班次，保留未來的班次
              if (etaMs >= nowMs) {
                if (!map.has(item.route) || etaMs < map.get(item.route).rawTime) {
                  map.set(item.route, {
                    route: item.route,
                    destZh: `往 ${item.dest_tc || ''}`,
                    destEn: `TO ${item.dest_en ? item.dest_en.toUpperCase() : ''}`,
                    eta: formatTime(item.eta),
                    rawTime: etaMs
                  });
                }
              }
            }
          });

          // 如果有抓到資料，更新路線列表
          if (map.size > 0) {
            routesData = Array.from(map.values()).sort((a, b) =>
              a.route.localeCompare(b.route, 'en', { numeric: true, sensitivity: 'base' })
            );
            renderPage(currentPage); // 抓到即更新介面
          }
        }
      } catch (err) {
        console.warn("無法取得即時 API 資料，請檢查連線：", err);
      }
    }

    function renderPage(pageIndex) {
      const totalPages = Math.ceil(routesData.length / ITEMS_PER_PAGE) || 1;
      currentPage = pageIndex % totalPages;
      const grid = document.getElementById('routeGrid');
      grid.innerHTML = '';

      const startIndex = currentPage * ITEMS_PER_PAGE;
      const pageItems = routesData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      for (let i = 0; i < ITEMS_PER_PAGE; i++) {
        const item = pageItems[i];
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (item) {
          cell.innerHTML = `
            <div class="left-col">
              <div class="route-num">${item.route}</div>
              <div class="route-dest">
                <div class="dest-zh">${item.destZh}</div>
                <div class="dest-en">${item.destEn}</div>
              </div>
            </div>
            <div class="route-eta">${item.eta}</div>
          `;
        }
        grid.appendChild(cell);
      }
    }

    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    });

    // 啟動流程
    updateClock();
    setInterval(updateClock, 1000); // 秒級時鐘刷新

    fetchData(); 
    setInterval(fetchData, 15000); // 改為 15 秒刷新一次 API 以確保「實時」感
    setInterval(() => { currentPage = (currentPage + 1) % Math.ceil((routesData.length || 1) / ITEMS_PER_PAGE); renderPage(currentPage); }, 10000);
  </script>
</body>
</html>
