<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下一班車 Next Departure 模擬</title>
  <style>
    :root {
      --orange: #f36c21;
      --blue: #0b3c75;
      --white: #ffffff;
      --black: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body { background-color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    /* 螢幕主容器 */
    .display-screen {
      width: 900px;
      height: 600px;
      background-color: var(--white);
      border: 4px solid #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. 頂部橙底時鐘區 */
    .clock-bar {
      background-color: var(--orange);
      color: var(--white);
      padding: 10px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    /* 2. 橙底白字「預計時間 ETA」標題列 */
    .eta-header-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background-color: var(--orange);
      color: var(--white);
      font-weight: bold;
      text-align: center;
      padding: 5px 0;
    }

    /* 路線表格網格 */
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      border-top: 1px solid #ccc;
    }

    .cell {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background-color: var(--white);
    }

    /* 黑色路線資訊 */
    .route-num { font-size: 32px; font-weight: 900; color: var(--black); width: 80px; }
    .route-dest { font-size: 14px; font-weight: bold; color: var(--black); flex: 1; line-height: 1.2; }

    /* 藍色開出時間 */
    .route-eta { font-size: 28px; font-weight: 800; color: var(--blue); width: 80px; text-align: right; }

    .footer-bar {
        background: #eee;
        padding: 5px;
        text-align: center;
        font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="display-screen">
    <!-- 頂部橙底時間 -->
    <div class="clock-bar">
      現在時間 Current Time: <span id="currentTime">12:19</span>
    </div>

    <!-- 橙底白字標題 -->
    <div class="eta-header-bar">
      <div>預計時間 ETA</div>
      <div>預計時間 ETA</div>
      <div>預計時間 ETA</div>
    </div>

    <!-- 路線資料區 -->
    <div class="grid-container" id="routeGrid"></div>
    
    <div class="footer-bar">每 10 秒自動刷新</div>
  </div>

  <script>
    const STOP_ID = "001552"; // 機場地面運輸中心

    // 更新時鐘
    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = 
        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    // 取得資料
    async function fetchData() {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${STOP_ID}`);
        const json = await res.json();
        const grid = document.getElementById('routeGrid');
        grid.innerHTML = '';

        // 取前 12 筆資料
        const items = json.data.slice(0, 12);
        
        items.forEach(item => {
          const etaDate = new Date(item.eta);
          const timeStr = `${String(etaDate.getHours()).padStart(2, '0')}:${String(etaDate.getMinutes()).padStart(2, '0')}`;
          
          const div = document.createElement('div');
          div.className = 'cell';
          div.innerHTML = `
            <div class="route-num">${item.route}</div>
            <div class="route-dest">${item.dest_tc}</div>
            <div class="route-eta">${timeStr}</div>
          `;
          grid.appendChild(div);
        });
      } catch (e) {
        console.error("無法連線", e);
      }
    }

    setInterval(updateClock, 1000);
    setInterval(fetchData, 30000);
    updateClock();
    fetchData();
  </script>
</body>
</html>
